name: Metadata and template checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  metadata-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate NeoForge metadata
        run: |
          ./gradlew templateCheck generateModMetadata
          ./gradlew -p source/gtna processResources
          ./gradlew -p source/pccard generateModMetadata
      - name: Verify minimum NeoForge version
        run: >-
          python3 tools/verify_metadata.py
          build/generated/sources/modMetadata/META-INF/neoforge.mods.toml
          source/gtna/build/resources/main/META-INF/neoforge.mods.toml
          source/pccard/build/generated/sources/modMetadata/META-INF/neoforge.mods.toml
